name: build-and-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $line = Select-String -Path gradle.properties -Pattern '^version=(.+)$'
          if (-not $line) { throw 'version is missing from gradle.properties' }
          $version = $line.Matches[0].Groups[1].Value.Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match project version v$version"
          }

      - name: Build and verify
        shell: pwsh
        run: |
          ./gradlew --no-daemon --stacktrace test combinedChecks plugin spoutChecks
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed" }
          $package = @(Get-ChildItem build/distributions -Filter '*.spmod' -File)
          if ($package.Count -ne 1) { throw "Expected exactly one .spmod, found $($package.Count)" }
          ./scripts/verify-spmod.ps1 -Path $package[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Package verification failed" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spw-lyrics-island-${{ github.sha }}
          path: |
            build/distributions/*.spmod
            build/distributions/*-source.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/distributions/*.spmod
            build/distributions/*-source.zip
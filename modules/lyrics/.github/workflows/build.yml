name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin package
        run: ./gradlew --no-daemon --stacktrace test plugin

      - name: List outputs
        run: Get-ChildItem build/libs | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: spw-lyrics-spmod
          path: build/libs/*.spmod
          if-no-files-found: error
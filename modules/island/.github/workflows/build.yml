name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin package and source archive
        run: ./gradlew --no-daemon --stacktrace plugin

      - name: List outputs
        run: Get-ChildItem build/distributions | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: spw-island-spmod
          path: |
            build/distributions/*.spmod
            build/distributions/*-source.zip
          if-no-files-found: error